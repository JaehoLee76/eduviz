<!doctype html><html lang="ko"><head>
<meta charset="utf-8">
<title>ADP Master</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="ADP 실기 합격 훈련 · 시각화로 이해하고 문제를 푼다">
<meta name="theme-color" content="#171319">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ADP">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="icon" href="./icon-192.png">
<style>
:root{
  --accent:#c0398f; --accent2:#e86fbf;
  --ink:#2b2730; --soft:#5c5663; --paper:#faf7fb; --card:#fff;
  --rule:#e4d7e4; --good:#1f9d6b; --warn:#c9772a; --track:#ecdfec;
}
@media(prefers-color-scheme:dark){
  :root{
    --accent:#e86fbf; --accent2:#f3a3d6;
    --ink:#ece7ef; --soft:#b3a9b8; --paper:#171319; --card:#211a24;
    --rule:#3a2f3c; --good:#5fd6a8; --warn:#e0a35a; --track:#2f2532;
  }
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Helvetica Neue",sans-serif;
  line-height:1.55; padding:0 0 3rem;
  min-height:100vh; min-height:100dvh;
}
.wrap{max-width:560px; margin:0 auto; padding:0 1.1rem}

/* --- 상단 헤더 --- */
header.hero{
  background:linear-gradient(160deg,var(--accent) 0%,var(--accent2) 100%);
  padding:calc(2.4rem + env(safe-area-inset-top)) 1.1rem 1.9rem;
  color:#fff; border-radius:0 0 26px 26px; margin-bottom:1.4rem;
}
header.hero .wrap{padding:0}
.eyebrow{
  font-size:.78rem; letter-spacing:.16em; text-transform:uppercase;
  font-weight:800; opacity:.92; margin:0 0 .35rem;
}
h1{font-size:2.1rem; margin:0 0 .4rem; font-weight:800; letter-spacing:-.01em}
.tagline{font-size:1.02rem; opacity:.95; margin:0 0 1.3rem; font-weight:500}

/* --- 진행률 --- */
.progress-card{
  background:rgba(255,255,255,.16); border:1px solid rgba(255,255,255,.28);
  border-radius:16px; padding:.95rem 1.1rem; backdrop-filter:blur(6px);
}
.progress-top{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:.55rem; gap:.6rem}
.progress-top .lab{font-size:.86rem; font-weight:700}
.progress-top .num{font-size:.86rem; font-weight:800; font-variant-numeric:tabular-nums}
.track{background:rgba(255,255,255,.3); border-radius:20px; height:11px; overflow:hidden}
.bar{background:#fff; height:100%; border-radius:20px; transition:width .5s ease}
.progress-note{font-size:.84rem; margin:.6rem 0 0; opacity:.92; font-weight:600}

/* --- 섹션 --- */
main{padding-top:.2rem}
h2.sec{
  font-size:1.02rem; font-weight:800; color:var(--soft);
  margin:1.7rem 0 .7rem; letter-spacing:.02em;
}
h2.sec:first-of-type{margin-top:0}

/* --- 카드 목록 --- */
.cards{display:grid; gap:.85rem}
a.card{
  display:block; background:var(--card); border:1px solid var(--rule);
  border-radius:16px; padding:1.05rem 1.15rem; text-decoration:none; color:inherit;
  box-shadow:0 1px 3px rgba(0,0,0,.05);
  transition:transform .12s ease, box-shadow .12s ease;
}
a.card:active{transform:scale(.98)}
a.card.disabled{opacity:.55; pointer-events:none}
.card-top{display:flex; align-items:center; gap:.6rem; margin-bottom:.5rem; flex-wrap:wrap}
.no{
  font-family:"SF Mono",ui-monospace,Menlo,monospace; font-weight:800; font-size:.82rem;
  color:var(--accent); background:color-mix(in srgb,var(--accent) 12%,transparent);
  border-radius:8px; padding:.15rem .5rem; letter-spacing:.02em;
}
.badge{
  font-size:.78rem; font-weight:700; color:var(--accent);
  background:color-mix(in srgb,var(--accent) 10%,transparent);
  border:1px solid color-mix(in srgb,var(--accent) 30%,transparent);
  border-radius:20px; padding:.15rem .65rem;
}
.status{
  margin-left:auto; font-size:.78rem; font-weight:800; border-radius:20px;
  padding:.15rem .65rem; white-space:nowrap;
}
.status.done{color:var(--good); background:color-mix(in srgb,var(--good) 14%,transparent)}
.status.soon{color:var(--soft); background:color-mix(in srgb,var(--soft) 14%,transparent)}
.card-title{font-size:1.12rem; font-weight:800; margin:0 0 .35rem; letter-spacing:-.01em}
.card-desc{font-size:.94rem; color:var(--soft); margin:0}
.card-arrow{
  display:flex; align-items:center; gap:.3rem; margin-top:.7rem;
  font-size:.86rem; font-weight:800; color:var(--accent);
}

/* --- 안내 / 푸터 --- */
.install-note{
  margin-top:2rem; background:var(--card); border:1px dashed var(--rule);
  border-radius:14px; padding:1rem 1.15rem; font-size:.9rem; color:var(--soft);
}
.install-note b{color:var(--ink)}
.install-note .step{
  display:flex; gap:.55rem; align-items:flex-start; margin-top:.55rem;
}
.install-note .step .ic{
  flex:none; width:1.6rem; height:1.6rem; border-radius:50%; background:var(--track);
  display:flex; align-items:center; justify-content:center; font-size:.85rem; font-weight:800; color:var(--accent);
}
footer.foot{
  margin-top:2.2rem; padding-top:1.1rem; border-top:1px solid var(--rule);
  font-size:.82rem; color:var(--soft); text-align:center;
}

@media (max-width:380px){
  h1{font-size:1.8rem}
  .card-title{font-size:1.05rem}
}
</style>
</head><body>

<header class="hero">
  <div class="wrap">
    <p class="eyebrow">ADP Master</p>
    <h1>ADP Master</h1>
    <p class="tagline">실기 합격 훈련 · 시각화로 이해하고 문제를 푼다</p>
    <div class="progress-card">
      <div class="progress-top">
        <span class="lab">통계 파트 진행률</span>
        <span class="num" id="progNum">2 / 11 유형</span>
      </div>
      <div class="track"><div class="bar" id="progBar" style="width:0%"></div></div>
      <p class="progress-note">정상정복: 실기부터.</p>
    </div>
  </div>
</header>

<main class="wrap">
  <h2 class="sec">실험실</h2>
  <div class="cards" id="cardList"></div>

  <div class="install-note">
    <b>이 페이지를 폰 홈 화면에 추가하면 앱처럼 열립니다.</b>
    <div class="step"><span class="ic">1</span><span>브라우저 공유(또는 메뉴) 버튼을 누른다</span></div>
    <div class="step"><span class="ic">2</span><span>"홈 화면에 추가"를 고른다</span></div>
    <div class="step"><span class="ic">3</span><span>추가된 아이콘으로 열면 전체화면·오프라인으로 실행된다</span></div>
  </div>

  <footer class="foot">
    질문·심화 학습은 PC의 EduViz 빅데이터 트랙에서.
  </footer>
</main>

<script>
var LABS = [
  { no:'0002', href:'labs/0002-anova-lab.html', badge:'통계 · 분산분석',
    title:'일원배치 분산분석 + 사후검정', sub:'29회 문7 유형',
    desc:'차종별 범퍼 손상지수를 F검정으로 비교하고, 유의하면 본페로니 사후검정으로 어느 쌍이 다른지까지 찾는다.',
    done:true, statPart:true },
  { no:'0003', href:'labs/0003-real-regression-problem.html', badge:'통계 · 회귀',
    title:'회귀모형 선택', sub:'단순 vs 다항',
    desc:'직선(1차)이 못 잡는 곡선성을 잔차도로 확인하고, 2차·3차를 수정 R²로 비교해 과적합을 피해 고른다.',
    done:true, statPart:true },
  { no:'0001', href:'labs/0001-fuel-economy-workflow.html', badge:'개념',
    title:'예측모델링 작업흐름', sub:'연비 (Fuel Economy)',
    desc:'엔진 배기량 하나로 고속도로 연비를 예측하며, 열 개 사례연구를 관통하는 6단계 작업흐름을 몸에 새긴다.',
    done:true, statPart:false }
];

function render(){
  var list = document.getElementById('cardList');
  list.innerHTML = LABS.map(function(l){
    var statusCls = l.done ? 'done' : 'soon';
    var statusTxt = l.done ? '완료' : '준비중';
    var tag = l.done ? 'a' : 'div';
    var hrefAttr = l.done ? ' href="'+l.href+'"' : '';
    return '<'+tag+' class="card'+(l.done?'':' disabled')+'"'+hrefAttr+'>'+
      '<div class="card-top">'+
        '<span class="no">'+l.no+'</span>'+
        '<span class="badge">'+l.badge+'</span>'+
        '<span class="status '+statusCls+'">'+statusTxt+'</span>'+
      '</div>'+
      '<p class="card-title">'+l.title+' <span style="color:var(--soft);font-weight:600;font-size:.85em">— '+l.sub+'</span></p>'+
      '<p class="card-desc">'+l.desc+'</p>'+
      (l.done ? '<div class="card-arrow">실험실 열기 →</div>' : '')+
    '</'+tag+'>';
  }).join('');

  var total = 11;
  var doneCount = LABS.filter(function(l){ return l.statPart && l.done; }).length;
  document.getElementById('progNum').textContent = doneCount+' / '+total+' 유형';
  document.getElementById('progBar').style.width = Math.round(doneCount/total*100)+'%';
}
render();

if('serviceWorker' in navigator){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('sw.js').catch(function(){ /* 오프라인 캐시 없이도 온라인 열람은 정상 동작 */ });
  });
}
</script>
</body></html>
